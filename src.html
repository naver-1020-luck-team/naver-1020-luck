<title>오늘의 운세 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800..900&display=swap" />
<style>
  @font-face { font-family: "Pretendard"; font-weight: 400; font-display: block; src: url(__font_pretendard-regular__) format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 500; font-display: block; src: url(__font_pretendard-medium__) format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 600; font-display: block; src: url(__font_pretendard-semibold__) format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 700; font-display: block; src: url(__font_pretendard-bold__) format("woff2"); }
  /* 단일 다크 테마: 앱 화면 프로토타입 */
  :root {
    color-scheme: dark;
    --mint: rgb(95, 254, 198);
    --ease: cubic-bezier(.65, 0, .35, 1);        /* ease-in-out */
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --spring: cubic-bezier(.34, 1.45, .5, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #050505; }
  body { display: grid; place-items: center; -webkit-font-smoothing: antialiased;
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  .phone {
    position: relative; width: 402px; height: 874px; overflow: hidden; background: #0e0e0e;
    border-radius: 48px; box-shadow: 0 0 0 10px #222, 0 30px 80px rgba(0,0,0,.6);
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  html, body { overflow: hidden; }
  .phone img { max-width: none; }   /* 게시 템플릿의 img{max-width:100%}가 키링 부품 이미지를 0px로 줄이지 않게 */
  .phone { flex: none; transform-origin: 50% 50%; }
  @media (max-width: 440px), (max-height: 900px) {
    .phone { border-radius: 0; box-shadow: none; }
    .replay { display: none; }
  }
  .scaler { position: absolute; left: 0; top: 0; width: 402px; height: 874px; transform-origin: 0 0; }
  /* 휴대폰으로 볼 때: 시안 속 가짜 상태바(9:41, 위 47px)를 잘라 내 실제 폰 상태바와 겹치지 않게, 화면을 꽉 채움 */
  html.mob body { padding-top: env(safe-area-inset-top); place-items: start center; }
  html.mob .phone { height: 827px; border-radius: 0; box-shadow: none; transform-origin: 50% 0; }
  html.mob .scaler { top: -47px; }
  html.mob .replay { display: none; }
  .layer { position: absolute; inset: 0; }
  .abs { position: absolute; display: block; }
  .no-anim, .no-anim * { transition: none !important; }

  /* ── 홈 ───────────────────────────── */
  #homeScroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain; background: #0e0e0e; }
  #homeScroll::-webkit-scrollbar { display: none; }
  .home-content { position: relative; width: 402px; height: 1006px; }   /* 874 + 최대 스크롤 132 */
  #homeHello, #homeTitle, #ctaCapture { will-change: transform, opacity; }
  #home { transform-origin: 50% 40%; transform: scale(.94); opacity: 0;
          transition: transform .7s var(--ease), opacity .7s var(--ease); }
  .s-fortune #home { opacity: 1; transition-delay: .8s; }   /* 운세 화면 뒤에 미리 깔아 둠 */
  .s-home #home { transform: none; opacity: 1; transition-delay: 0s; }
  /* 홈 카드 3종: 누르면 살짝 눌리고 → 민트로 바뀐 뒤 → 다음 화면으로 */
  .hcard { cursor: pointer; transition: transform .5s var(--spring); }
  .hcard.pressed { transform: scale(.965); transition: transform .14s var(--ease-out); }
  .hcard img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hcard .on { opacity: 0; transition: opacity .26s var(--ease); }
  .hcard.sel .on { opacity: 1; }

  /* ── 화면 이동 (push / back) ──────── */
  :root { --nav: cubic-bezier(.6, 0, .2, 1); --nav-t: .6s; }
  .inner { position: absolute; inset: 0; transition: transform var(--nav-t) var(--nav); }
  .shade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none;
           transition: opacity var(--nav-t) var(--nav); }
  .under > .inner { transform: translateX(-28%); }
  .under > .shade { opacity: .5; }
  .push { background: #0e0e0e; transform: translateX(100%); visibility: hidden;
          box-shadow: -16px 0 40px rgba(0,0,0,.45);
          transition: transform var(--nav-t) var(--nav), visibility 0s linear var(--nav-t); }
  .push.on { transform: none; visibility: visible; transition: transform var(--nav-t) var(--nav), visibility 0s; }
  .shop { background: #fff; }
  /* 상세 화면 요소가 차례로 자리 잡음 */
  .d-in { opacity: 0; transform: translateY(14px); transition: opacity .3s var(--ease), transform .3s var(--ease); }
  .d-hero { transform: scale(.94); transform-origin: 50% 45%; }
  .push.on .d-in { opacity: 1; transform: none; transition: opacity .55s var(--ease), transform .7s var(--ease-out); }
  .push.on .d-hero { transition-delay: .2s; } .push.on .d-body { transition-delay: .32s; }
  .push.on .d-icons { transition-delay: .4s; } .push.on .d-btn { transition-delay: .48s; }
  .hot { position: absolute; cursor: pointer; }
  /* 공통 하단 내비 (팀원 앱 .bottom-nav 와 같은 값) */
  .bottom-nav { position: absolute; left: 0; top: 780px; width: 402px; height: 94px; margin: 0; background: rgba(40, 40, 40, .9);
                -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 30px 30px 0 0;
                font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .bottom-nav__list { display: grid; grid-template-columns: repeat(4, 1fr); padding: 12px 28px 0; margin: 0; list-style: none; }
  .bottom-nav__item { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0; border: 0; background: none;

  .bottom-nav__item.is-active { color: #fff; font-weight: 600; }
  .bottom-nav__item svg { display: block; }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 100px; background: #fff; }
  #freqLayer { z-index: 40; background: #121212; visibility: hidden; }
  .tab-freq #freqLayer { visibility: visible; }
  #freqFrame { position: absolute; inset: 0; width: 402px; height: 874px; border: 0; display: block; background: #121212; }
  /* ── 친구방 ── */

  /* 작은 글자는 HTML로 다시 그림 (배경색으로 이미지 글자를 덮음) */
  .fr-text { position: absolute; background: #0e0e0e; color: #ececec; font-family: "Pretendard", -apple-system, sans-serif;
             font-size: 14.5px; font-weight: 500; letter-spacing: -.35px; line-height: 24px; pointer-events: none; }
  .fr-head-t { position: absolute; left: 140px; top: 64px; width: 122px; height: 34px; background: #0e0e0e; color: #fff; text-align: center;
               font-family: "Pretendard", -apple-system, sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -.4px; line-height: 34px; pointer-events: none; }
  .fr-content > img { display: block; pointer-events: none; }
  /* Lucky Moments: 가로 스크롤 (시안 세 장을 이어 붙인 띠, 최대 480px) */
  #frRow { position: absolute; left: 0; top: 545px; width: 402px; height: 274px; overflow-x: auto; overflow-y: hidden;
           scrollbar-width: none; overscroll-behavior-x: contain; background: #0e0e0e; }
  #frRow::-webkit-scrollbar { display: none; }
  #frRow img { display: block; width: 882px; height: 274px; pointer-events: none; }
  .fr-row-in { position: relative; width: 882px; height: 274px; }
  .moment-hot { position: absolute; top: 0; width: 160px; height: 274px; border: 0; padding: 0; background: transparent; cursor: pointer;
                border-radius: 28px; transition: transform .4s var(--spring); }
  .moment-hot:active { transform: scale(.97); transition: transform .12s; }
  #luckyTalk { border-radius: 40px; transition: transform .4s var(--spring); }
  /* 운세 수다방 카드: 가운데 1장 + 양옆 2장씩. 옆 카드를 누르거나 밀면 돌아감 (1109 시안) */
  #rooms { position: absolute; left: 0; top: 122px; width: 402px; height: 318px; touch-action: pan-y; }
  .room { position: absolute; top: 0; left: 50%; width: 197px; height: 318px; border-radius: 60px; overflow: hidden; padding: 0; border: 0;
    background: #2a2a2a; color: #fff; text-align: center; transform: translateX(-50%); cursor: pointer; -webkit-tap-highlight-color: transparent;
    font-family: "Pretendard", -apple-system, sans-serif;
    transition: left .5s cubic-bezier(.22,1,.36,1), top .5s cubic-bezier(.22,1,.36,1), width .5s cubic-bezier(.22,1,.36,1), height .5s cubic-bezier(.22,1,.36,1), opacity .45s var(--ease), box-shadow .45s var(--ease); }
  .room > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .room .rm-grad { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0) 29.4%, #000 100%); opacity: 0; transition: opacity .45s var(--ease); }
  .room .rm-dim { position: absolute; inset: 0; background: rgba(0,0,0,.2); transition: opacity .45s var(--ease), background .45s var(--ease); }
  .room .rm-badge { position: absolute; top: 17.5px; right: 25.5px; width: 21px; height: 21px; border-radius: 50%; background: #FF39C7; color: #000;
    font-size: 14px; font-weight: 700; line-height: 21px; transition: opacity .3s var(--ease); }
  .room .rm-info { position: absolute; left: 0; right: 0; top: 218px; display: flex; flex-direction: column; align-items: center; transition: top .5s cubic-bezier(.22,1,.36,1); }
  .room .rm-mem { font-size: 14px; font-weight: 500; line-height: 1.45; letter-spacing: -.56px; color: rgba(255,255,255,.7); transition: opacity .3s var(--ease); }
  .room .rm-title { margin-top: 9px; font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -.88px; white-space: nowrap; color: rgba(255,255,255,.8);
    display: inline-flex; align-items: center; gap: 6.7px; transition: opacity .3s var(--ease), color .3s var(--ease); }
  .room[data-pos="0"] { z-index: 5; box-shadow: 3.5px 3.5px 48px rgba(55,55,55,.25); }
  .room[data-pos="0"] .rm-grad { opacity: 1; } .room[data-pos="0"] .rm-dim { opacity: 0; } .room[data-pos="0"] .rm-title { color: #fff; }
  .room[data-pos="-1"], .room[data-pos="1"] { z-index: 4; top: 28px; width: 162.6px; height: 262.5px; box-shadow: 3.5px 3.5px 48px rgba(187,187,187,.25); }
  .room[data-pos="-1"] { left: calc(50% - 72.5px); } .room[data-pos="1"] { left: calc(50% + 73.3px); }
  .room[data-pos="-2"], .room[data-pos="2"] { z-index: 3; top: 57px; width: 126px; height: 205px; opacity: .89; }
  .room[data-pos="-2"] { left: calc(50% - 118px); } .room[data-pos="2"] { left: calc(50% + 118px); }
  .room[data-pos="-2"] .rm-dim, .room[data-pos="2"] .rm-dim { background: rgba(0,0,0,.4); }
  .room:not([data-pos="0"]) .rm-badge, .room:not([data-pos="0"]) .rm-mem, .room[data-pos="-2"] .rm-title, .room[data-pos="2"] .rm-title { opacity: 0; }
  .room:not([data-pos="0"]) .rm-info { top: 176px; }
  .room.baked .rm-grad { display: none; }
  .room.wrap { z-index: 1 !important; animation: rmWrap .5s cubic-bezier(.65,0,.35,1); }
  @keyframes rmWrap { 0%, 100% { opacity: .89; } 50% { opacity: 0; } }
  .room[data-pos="0"]:active { transform: translateX(-50%) scale(.98); transition: transform .15s var(--ease); }

  /* ── 행운 공구방 채팅 ── */
  #scr-chat { background: #fff; }
  /* 채팅은 위아래로 스크롤 (대화 A → 대화 B → 새 메시지) */
  #chMsgs { position: absolute; left: 0; top: 187px; width: 402px; height: 581px; overflow-y: auto; overflow-x: hidden;
            scrollbar-width: none; overscroll-behavior: contain; padding-bottom: 28px; box-sizing: border-box; }
  #chMsgs::-webkit-scrollbar { display: none; }
  .ch-spacer { height: 0; transition: height .55s var(--ease); }
  .ranked .ch-spacer { height: 111px; }
  .ch-thread { position: relative; width: 402px; height: 1025px; transition: height .4s var(--ease); }
  /* ── 채팅: 텍스트·말풍선은 HTML로 (어떤 해상도에서도 선명) ── */
  #scr-chat { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  .ch-thread .bub, .ch-thread .nm-name, .ch-thread .av, .ch-thread .placecard, .ch-thread .mixcard { position: absolute; }
  .bub { height: 40px; padding: 0 14px; display: flex; align-items: center; white-space: nowrap; border-radius: 20px;
         font-size: 15px; font-weight: 500; letter-spacing: -.35px; line-height: 1; }
  .bub.two { height: 67px; padding: 0 14px; border-radius: 20px; line-height: 23.5px; display: block; padding-top: 10px; }
  .bub.you { left: 68px; background: #121212; color: #fff; }
  .bub.me { right: 20px; background: #FFA1F9; color: #111; }
  .nm-name { left: 69px; font-size: 12.5px; font-weight: 500; color: #3a3a3a; letter-spacing: -.1px; line-height: 15px; }
  .av { left: 19px; width: 42px; height: 42px; pointer-events: none; }
  .mixcard { left: 68px; width: 269px; height: 99px; border-radius: 22px; background: #121212; cursor: pointer;
             transition: transform .4s var(--spring); }
  .mixcard:active { transform: scale(.97); transition: transform .12s; }
  .mixcard img { position: absolute; left: 14px; top: 10px; width: 112px; height: 37px; }
  .mixcard span { position: absolute; left: 20px; top: 56px; color: #fff; font-size: 13.5px; font-weight: 500; letter-spacing: -.3px; }
  .mix-go { position: absolute; right: 12px; bottom: 12px; width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .placecard { right: 20px; width: 268px; height: 138px; border-radius: 22px; background: #5EFFC7; }
  .placecard img { position: absolute; left: 7px; top: 7px; width: 124px; height: 124px; border-radius: 16px; object-fit: cover; }
  .pc-tag { position: absolute; left: 144px; top: 13px; font-family: "Archivo", "Arial Narrow", sans-serif; font-stretch: 70%;
            font-weight: 800; font-size: 15px; letter-spacing: -.4px; color: #3f8f73; }
  .placecard strong { position: absolute; left: 144px; top: 38px; font-size: 18px; font-weight: 700; color: #111; letter-spacing: -.5px; }
  .pc-btn { position: absolute; left: 140px; top: 95px; width: 117px; height: 35px; border-radius: 18px; background: #121212; color: #fff;
            display: grid; place-items: center; font-size: 14px; font-weight: 600; letter-spacing: -.3px; }
  .ch-thread > .nm { position: absolute; inset: 0 auto auto 0; width: 402px; opacity: 0; transform: translateY(14px) scale(.96);
                     transition: opacity .35s var(--ease), transform .5s var(--spring); pointer-events: none; }
  .ch-thread > .nm.me { transform-origin: 100% 0; } .ch-thread > .nm.you { transform-origin: 0 0; }
  .ch-thread > .nm.show { opacity: 1; transform: none; }
  /* 상단: 상태바 · 제목 · 칩 · 순위 바 */
  #chHead .ch-status { position: absolute; left: 0; top: 0; width: 402px; height: 54px; display: flex; align-items: center;
                       justify-content: space-between; padding: 6px 30px 0 46px; font-size: 17px; font-weight: 600; color: #111; }
  .ch-status .icons { display: flex; gap: 6px; align-items: center; }
  .ch-back { position: absolute; left: 21px; top: 67px; }
  .ch-title { position: absolute; left: 0; top: 64px; width: 402px; text-align: center; font-size: 20px; font-weight: 600; letter-spacing: -.6px; color: #111; line-height: 32px; }
  .ch-title svg { vertical-align: -2px; } .ch-title em { font-style: normal; color: #b8b8bd; font-weight: 500; margin-left: 2px; }
  .ch-chips { position: absolute; left: 20px; top: 130px; display: flex; gap: 9px; white-space: nowrap; }

                   letter-spacing: -.4px; display: flex; align-items: center; transition: background .3s var(--ease), color .3s var(--ease); }
  .ranked .ch-chips .chip-rank { background: #FE39C7; color: #fff; }

  .rk:first-child { margin-left: 0; }
  .rk img { width: 62px; height: 62px; display: block; }
  .rk b { display: block; width: 62px; text-align: center; margin-top: 6px; font-size: 13px; font-weight: 600; color: #111; letter-spacing: -.2px; }
  /* 입력창 */
  #chInput { position: absolute; left: 0; top: 760px; width: 402px; height: 114px;
             background: linear-gradient(rgba(251,251,251,0), #F7F7F9 30%, #EFF0F4 64%); }
  .ci-plus { position: absolute; left: 24px; top: 20px; width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .ci-field { position: absolute; left: 76px; top: 18px; width: 302px; height: 48px; border-radius: 24px; background: #fff;
              padding-left: 17px; display: flex; align-items: center; font-size: 15px; color: #b5b5ba; letter-spacing: -.3px; }

  #chFade { position: absolute; left: 0; top: 728px; width: 402px; height: 40px; pointer-events: none;

  /* 딤 공통: 실제 채팅 위에 흐림 + 어두운 막 (시안 값에서 역산) */
  .dim { position: absolute; inset: 0; z-index: 20; opacity: 0; visibility: hidden;
         transition: opacity .35s var(--ease), visibility 0s linear .35s; }
  #rkDim, #mxDim { background: #2b2b2b; }
  .dimmed #rkDim, .mixing #mxDim { opacity: 1; visibility: visible; transition: opacity .35s var(--ease), visibility 0s; }
  .dim .pop { opacity: 0; transform: translateY(12px); transition: opacity .2s var(--ease), transform .2s var(--ease); }
  .dimmed #rkDim .pop, .mixing #mxDim .pop { opacity: 1; transform: none; transition: opacity .5s var(--ease), transform .7s var(--ease-out); }

  /* 딤_0: 제목만 크게 등장 → 1.3초 뒤 위로 올라가며 작아지고, 1등 화면(딤_1)이 드러남 */
  #rkTitle0 { opacity: 0; transform: scale(.9); transform-origin: 160.5px 68px; transition: opacity .2s, transform .2s; }
  .dimmed #rkTitle0 { opacity: 1; transform: none; transition: opacity .55s var(--ease) .15s, transform .8s var(--ease-out) .15s; }
  .dimmed.rk-reveal #rkTitle0 { opacity: 0; transform: translateY(-192px) scale(.77);
       transition: transform .85s cubic-bezier(.65,0,.35,1), opacity .35s var(--ease) .9s; }
  #rkBg1 { opacity: 0; transition: opacity .2s; }
  .dimmed.rk-reveal #rkBg1 { opacity: 1; transition: opacity .55s var(--ease) .82s; }
  #rkDim #rkOk, #rkDim #rkGift { pointer-events: none; }
  .rk-reveal #rkDim #rkOk, .rk-reveal #rkDim #rkGift { pointer-events: auto; }
  /* 순위 딤 이모지: 위에서 떨어지는 잎처럼 좌우로 살랑이며 내려와 제자리에 앉음 */
  #rkDim .drop { opacity: 0; transform: translate3d(0, var(--y), 0) rotate(var(--r)); will-change: transform, opacity;
                 transition: opacity .2s, transform .2s; }

<script>
const phone = document.getElementById("phone");
const scaler = document.getElementById("scaler");
// 폰 프레임은 절대 스크롤되지 않게 (안쪽 요소가 넘쳐도 화면이 밀리지 않음)
[phone, document.getElementById("scaler")].forEach(el => el.addEventListener("scroll", () => { if (el.scrollTop || el.scrollLeft) { el.scrollTop = 0; el.scrollLeft = 0; } }));
// 휴대폰(터치 + 좁은 화면)에서 열면 모바일 보기
const MOB = (matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0) && Math.min(window.screen.width, window.screen.height) <= 500;
document.documentElement.classList.toggle("mob", MOB);
function fit() {   // 비율을 유지한 채 창 안에 맞춤
  if (MOB) {
    const top = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    const s = Math.min(innerWidth / 402, (innerHeight - top) / 827);
    phone.style.transform = `scale(${s})`; return;
  }
  const s = Math.min(1, innerWidth / 402, innerHeight / 874);
  phone.style.transform = `scale(${s})`;
}
addEventListener("resize", fit); fit();

let timer;
function go(state) {
  if (state === "fortune" || state === "home") markFortuneSeen();   // 운세를 한 번 봤음
  phone.classList.remove("s-clear", "s-fortune", "s-home");
  const add = { clear: ["s-clear"], fortune: ["s-clear", "s-fortune"], home: ["s-clear", "s-fortune", "s-home"] }[state] || [];
  phone.classList.add(...add);
}
// 페이지를 열 때는 항상 오늘의운세_딤1부터. 한 번 본 뒤 '처음부터'를 누르면 홈_기본에서 시작 (오늘의 운세는 하루 한 번)
let fortuneSeen = false;
function markFortuneSeen() { fortuneSeen = true; }
let startSeq = 0;
function start(forceFortune) {
  clearTimeout(timer); const seq = ++startSeq;
  phone.classList.add("no-anim");
  phone.classList.remove("x-close");
  resetNav();
  const toHome = fortuneSeen && !forceFortune;
  go(toHome ? "home" : "dim");
  void phone.offsetWidth;
  // 화면이 실제로 그려진 다음(두 프레임 뒤)에 애니메이션을 다시 켬 → 되돌아가는 모션이 보이지 않음
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (seq !== startSeq) return;
    phone.classList.remove("no-anim");
    // 1 → 2: 탭 없이 블러가 서서히 걷힘
    if (!toHome) timer = setTimeout(() => go("clear"), 1100);
  }));
}

// 2 → 3: 보러가기
document.getElementById("dimBtn").addEventListener("click", () => {
  if (phone.classList.contains("s-clear") && !phone.classList.contains("s-fortune")) go("fortune");
});
// 딤 화면의 X: 바로 홈으로
document.getElementById("dimX").addEventListener("click", () => {
  if (!phone.classList.contains("s-clear") || phone.classList.contains("s-fortune")) return;
  markFortuneSeen(); clearTimeout(timer);
  phone.classList.add("x-close", "s-fortune", "s-home");
});
// 3 → 4: 운세 화면 탭
document.getElementById("fortune").addEventListener("click", () => {
  if (phone.classList.contains("s-fortune") && !phone.classList.contains("s-home")) go("home");
});
// ── 하단 내비 탭: 홈 ↔ 친구방 (내 행운·주파수는 아직 화면 없음)
let tab = "home";
const frScroll = document.getElementById("frScroll");
function setTab(name, instant) {
  if (name === tab && !instant) { if (name === "friends") frScroll.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const changed = name !== tab; tab = name;
  const owned = instant && !phone.classList.contains("no-anim");   // 이미 바깥에서 애니메이션을 끈 상태면 건드리지 않음
  if (owned) phone.classList.add("no-anim");
  phone.classList.toggle("tab-friends", name === "friends");
  if (name === "friends" && changed) frScroll.scrollTop = 0;   // 같은 탭으로 돌아올 때(스토리 보고 복귀 등)는 보던 위치 유지
  syncNav(name);
  if (owned) { void phone.offsetWidth; phone.classList.remove("no-anim"); }
}
const appNav = document.getElementById("appNav");
function syncNav(name) {
  appNav.querySelectorAll(".bottom-nav__item").forEach(b => {
    const on = b.dataset.tab === name; b.classList.toggle("is-active", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
appNav.querySelectorAll(".bottom-nav__item").forEach(b => b.addEventListener("click", () => {
  if (stack.length > 1 || !phone.classList.contains("s-home")) return;
  const k = b.dataset.tab;
  if (k === "myluck") { toast("아카이브는 곧 열려요"); return; }
  if (k === "frequency") openFreq("frequency");
  else if (k === "home" || k === "friends") setTab(k);
}));
// 데스크톱에서도 마우스로 끌어서 스크롤 (터치·트랙패드·휠은 기본 스크롤). 5px 넘게 움직여야 드래그로 판단 → 탭은 그대로 동작
function dragScroll(el, axis) {

  stopKeyFinal();
  keyTimer = setTimeout(() => {
    evFinal.classList.add("show"); const t0 = performance.now();
    const f = now => {
      const t = (now - t0) / 1000;
      const vis = Math.min(1, t / .9), e = -(Math.cos(Math.PI * vis) - 1) / 2;
      const k = Math.min(1, t / 1.3), pop = 1 + 1.6 * Math.pow(k - 1, 3) + .6 * Math.pow(k - 1, 2);
      const a = .07 * Math.exp(-t / 1.5) * Math.sin(2 * Math.PI * .75 * t) + .012 * Math.sin(t * 1.15) * Math.min(1, t / 3);
      evKey.style.opacity = e.toFixed(3);
      evKey.style.transform = `translateY(${((1 - pop) * 18).toFixed(2)}px) rotate(${a}rad) scale(${(.93 + .07 * pop).toFixed(4)})`;
      keyRAF = requestAnimationFrame(f);
    };
    keyRAF = requestAnimationFrame(f);
  }, 4450 + 1200);   // 궤도 장면을 1.2초 늘린 만큼
}
function stopKeyFinal() { clearTimeout(keyTimer); cancelAnimationFrame(keyRAF); evFinal.classList.remove("show"); evKey.style.opacity = 0; }
const _evStart = window.evStart, _evStop = window.evStop;
window.evStart = () => { _evStart(); startKeyFinal(); };
window.evStop = () => { _evStop(); stopKeyFinal(); };
// 시연용: 키링 장면 바로 보기
document.getElementById("replayKey").addEventListener("click", () => {

});

// 이미지(약 6MB)가 모두 준비된 뒤 시작 → 딤1이 확실히 보이고 블러가 걷히는 장면을 놓치지 않음
// 팀원 앱(친구방·주파수: chiring/)과 연결 — 주파수 탭·기운 선물하기 → 팀원 앱, 팀원 앱의 홈 → #home 으로 돌아옴
const freqFrame = document.getElementById("freqFrame");
// 주파수(팀원 앱)는 한 번만 불러 두고, 화면 전환은 신호(postMessage)로 → 다시 불러오지 않아 빈 화면·무반응이 생기지 않음
let freqLoaded = false, freqQueue = [];
function freqSend(msg) {
  if (freqLoaded) { try { freqFrame.contentWindow.postMessage(msg, "*"); } catch (e) {} }
  else freqQueue.push(msg);
}
freqFrame.addEventListener("load", () => {
  if (!freqFrame.getAttribute("src") || freqFrame.getAttribute("src") === "about:blank") return;
  freqLoaded = true; const q = freqQueue; freqQueue = []; q.forEach(freqSend);
});
function ensureFreq() { if (!freqFrame.dataset.started) { freqFrame.dataset.started = "1"; freqFrame.src = "chiring/index.html#frequency"; } }
function openFreq(where) {

}
function closeFreq(to) {

// ── 기본 버튼들: 하트·별·재생 토글, 눌림 반응, 안내 토스트
const toastEl = document.getElementById("toast"); let toastT = 0;
function toast(msg, ms = 1900) {
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), ms);
}
function hideToast() { clearTimeout(toastT); toastEl.classList.remove("show"); }
document.querySelectorAll(".sb").forEach(b => {
  if (b.dataset.fx === "heart" && !b.classList.contains("heart-w")) for (let i = 0; i < 6; i++) { const d = document.createElement("i"); d.className = "burst"; d.style.setProperty("--a", (i * 60) + "deg"); b.appendChild(d); }
  let t = 0;
  b.addEventListener("pointerdown", () => { clearTimeout(t); b.classList.add("rip"); });
  const up = () => { t = setTimeout(() => b.classList.remove("rip"), 140); };
  b.addEventListener("pointerup", up); b.addEventListener("pointerleave", up); b.addEventListener("pointercancel", up);
  b.addEventListener("click", e => {
    e.stopPropagation();
    if (busy) return;
    const fx = b.dataset.fx;
    if (fx === "heart" || fx === "toggle") {
      const on = b.classList.toggle("on");
      b.classList.remove("pop");
      if (on && fx === "heart" && !b.classList.contains("heart-w")) { void b.offsetWidth; b.classList.add("pop"); }
      const m = on ? b.dataset.on : b.dataset.off; if (m) toast(m);
    } else if (fx === "zoom") {
      const z = cam.classList.toggle("zoom2"); toast(z ? "2배로 확대했어요" : "1배로 돌아왔어요", 1200);
    } else if (fx === "flip") {
      const vf = document.getElementById("vf"); vf.classList.remove("flip"); void vf.offsetWidth; vf.classList.add("flip");
    } else if (fx === "top") {
      toast("맨 위예요", 1100);
    } else if (b.dataset.msg) toast(b.dataset.msg);
  });
});
// 화면이 바뀌면 토스트는 바로 사라짐
["push", "pop"].forEach(n => { const f = window[n]; if (typeof f === "function") window[n] = function () { hideToast(); return f.apply(this, arguments); }; });

// 채팅 입력: 직접 써서 보내면 내 말풍선이 아래에 붙음
const chIn = document.getElementById("chIn"), chSend = document.getElementById("chSend");
function syncTyping() { chat.classList.toggle("typing", chIn.value.length > 0); }
chIn.addEventListener("input", syncTyping);
function clearMine() { chThread.querySelectorAll(".mine").forEach(m => m.remove()); chIn.value = ""; syncTyping(); }
function contentBottom() {
  const mine = chThread.querySelectorAll(".mine"); if (mine.length) { const m = mine[mine.length - 1]; return m.offsetTop + m.offsetHeight; }
  return threadEnd();
}
function sendMine() {
  const v = chIn.value.trim(); if (!v) { chIn.focus(); return; }

  const m = document.createElement("div"); m.className = "mine"; m.textContent = v; m.style.top = top + "px";

}
chIn.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); sendMine(); } });
chSend.addEventListener("pointerdown", e => { e.preventDefault(); chSend.classList.add("pressed"); });
chSend.addEventListener("pointerup", () => setTimeout(() => chSend.classList.remove("pressed"), 120));
chSend.addEventListener("pointerleave", () => chSend.classList.remove("pressed"));
chSend.addEventListener("click", sendMine);

document.querySelectorAll(".moment-hot").forEach(el => el.addEventListener("click", () => {
  if (busy || stack.length > 1 || tab !== "friends" || phone.classList.contains("tab-freq")) return;
  openStory(el.dataset.moment);
}));

/* ── Lucky Moments (친구 스토리) ─────────────
   기운 버튼을 누르면 사진 위에 스티커가 '쿵' 찍히고 내 이름표가 붙음 (끌어서 원하는 곳에 놓아도 됨).
   메시지 칸을 누르면 사진이 작아지며 올라가고 키보드가 올라옴. 옆으로 밀면 다음 친구 스토리. */
const ST_ART = {   // 4배 픽셀 그림 → 화면에서는 1/4 크기, 채움색은 시안처럼 그라디언트
  fire: { src: "__img_lm_st_fire__", w: 57, h: 66 }, water: { src: "__img_lm_st_water__", w: 39.5, h: 39.5 },
  diamond: { src: "__img_lm_st_diamond__", w: 48.5, h: 41.75 }, leaf: { src: "__img_lm_st_leaf__", w: 35, h: 48.25 },
  sprout: { src: "__img_lm_st_sprout__", w: 43.75, h: 30.75 } };
const ST_BTNS = [
  { type: "fire", label: "불의 기운", cx: 31, cy: 715, size: 72, k: .66 }, { type: "water", label: "물의 기운", cx: 108.8, cy: 678.5, size: 81.6, k: 1 },
  { type: "diamond", label: "금의 기운", cx: 200.5, cy: 667.2, size: 88, k: 1 }, { type: "leaf", label: "나무의 기운", cx: 293.8, cy: 678.9, size: 81.6, k: 1 },
  { type: "sprout", label: "흙의 기운", cx: 371, cy: 715.2, size: 72, k: 1 } ];
const ST_ME = "나";
const MOMENTS = [
  { id: "unahynn", name: "Unahynn", photo: "__img_lm_m_unahynn__", av: "__img_lm_av_unahynn__", crop: [-43, 0, 75, 42], typed: "오늘 사진 분위기 미쳤다 ㅋㅋ 기운 받아 가 !!",
    stk: [["water", "Sumin", 95, 278], ["sprout", "Minhee", 270, 148], ["diamond", "SSU", 255, 323]] },
  { id: "sumin", name: "Sumin", photo: "__img_lm_m_sumin__", av: "__img_lm_av_sumin__", crop: [-12.8, -8, 56, 56], cap: "드디어 시험 D-DAY,,", pos: "50% 60%", typed: "불 기운이 시험날 좋대서 붙여둠 !! 야르 ㅋㅋ",
    stk: [["fire", "MINJU", 295, 150], ["gem-pair", "Kwon", 63.5, 252], ["leaf-pair", "Minhee", 261.3, 334]] },
  { id: "minhee", name: "Minhee", photo: "__img_lm_m_minhee__", av: "__img_lm_av_minhee__", cap: "하ㅏ 월요일 1교시 에바야 ㅠ", typed: "물 기운 보내줄게 오늘만 버티자 ㅠㅠ",
    stk: [["fire", "Sumin", 280, 168], ["leaf-pair", "Kwon", 90, 278], ["water", "SSU", 250, 333]] },
  { id: "ssu", name: "SSU", photo: "__img_lm_m_ssu__", av: "__img_lm_av_ssu__", crop: [-1, -3.1, 34.3, 36], typed: "여기 어디야 ?? 나도 데려가 ㅋㅋ",
    stk: [["leaf", "Minhee", 95, 153], ["fire", "MINJU", 270, 268], ["gem-pair", "Kwon", 120, 338]] },
  { id: "kwon", name: "Kwon", photo: "__img_lm_m_kwon__", av: "__img_lm_av_kwon__", crop: [-7.6, 0, 47, 32.2], typed: "오늘 운세 1등 기운 가득 받아 가 !!",
    stk: [["gem-pair", "Sumin", 115, 168], ["sprout", "SSU", 265, 278], ["water", "Minhee", 95, 338]] },
];
const story = document.getElementById("story"), stPhoto = document.getElementById("stPhoto"), stStk = document.getElementById("stStk");
const stIn = document.getElementById("stIn"), stMine = {};   // 내가 붙인 스티커는 친구별로 기억
let stIdx = 1, stTypeT = 0;
const artH = t => t === "gem-pair" ? 52 : t === "leaf-pair" ? 42.5 : ST_ART[t].h;
function artHTML(t) {
  const L = "__img_lm_st_leaf_small_a__", L2 = "__img_lm_st_leaf_small_b__", GA = "__img_lm_st_gem_a__", GB = "__img_lm_st_gem_b__";
  if (t === "gem-pair") return `<span class="stk-art" style="width:73px;height:52px"><img src="${GA}" style="left:0;top:0;width:54.5px;height:49.75px" alt=""><img src="${GB}" style="left:29px;top:5px;width:44px;height:41.5px" alt=""></span>`;
  if (t === "leaf-pair") return `<span class="stk-art" style="width:45px;height:42.5px"><img src="${L}" style="left:16.1px;top:3.9px;width:28.75px;height:38.5px" alt=""><img src="${L2}" style="left:0;top:0;width:24.25px;height:31.25px" alt=""></span>`;
  const a = ST_ART[t]; return `<span class="stk-art" style="width:${a.w}px;height:${a.h}px"><img src="${a.src}" style="left:0;top:0;width:100%;height:100%" alt=""></span>`;
}
function stickerEl(t, from, x, y, label, delay) {
  const d = document.createElement("div"); d.className = "stk stamp"; d.style.left = x + "px"; d.style.top = y + "px";
  d.style.setProperty("--lo", (artH(t) / 2 + 8) + "px"); d.style.setProperty("--dl", delay + "ms");
  d.innerHTML = artHTML(t) + (label ? `<span class="stk-label">${from}</span>` : ""); return d;
}
function renderStory(dir) {
  const m = MOMENTS[stIdx];
  const img = document.getElementById("stImg"); img.src = m.photo; img.style.objectPosition = m.pos || "50% 50%";   // 수민: 시안과 같은 부분이 보이게
  document.getElementById("stCap").textContent = m.cap || "";
  const av = document.getElementById("stAv"), c = m.crop, k = 35 / 32;
  av.src = m.av; av.style.cssText = c ? `inset:auto;left:${c[0] * k}px;top:${c[1] * k}px;width:${c[2] * k}px;height:${c[3] * k}px;object-fit:fill` : "";
  document.getElementById("stName").textContent = m.name;
  stStk.innerHTML = "";
  const all = m.stk.map(s => ({ t: s[0], from: s[1], x: s[2], y: s[3] })).concat(stMine[m.id] || []);
  const lastOf = {}; all.forEach((s, i) => lastOf[s.from] = i);   // 이름표는 사람마다 마지막 스티커에만
  all.forEach((s, i) => stStk.appendChild(stickerEl(s.t, s.from, s.x, s.y, lastOf[s.from] === i, 250 + i * 380)));
  story.classList.remove("slide-l", "slide-r"); if (dir) { void story.offsetWidth; story.classList.add(dir > 0 ? "slide-l" : "slide-r"); }
}
function openStory(id) { stIdx = Math.max(0, MOMENTS.findIndex(m => m.id === id)); stopTyping(true); renderStory(0); push("story"); }
function addMine(t, x, y) {
  const m = MOMENTS[stIdx], list = stMine[m.id] = stMine[m.id] || [];
  list.push({ t, from: ST_ME, x, y });
  stStk.querySelectorAll(".stk").forEach(el => { if (el.querySelector(".stk-label") && el.querySelector(".stk-label").textContent === ST_ME) el.querySelector(".stk-label").remove(); });
  stStk.appendChild(stickerEl(t, ST_ME, x, y, true, 0));
  toast(`${m.name}님에게 ${ST_BTNS.find(b => b.type === t).label}을 보냈어요`, 1500);
}
const SPOTS = [[90, 120], [280, 110], [180, 230], [80, 360], [290, 380], [200, 330], [120, 190], [250, 210]];
function freeSpot() {
  const m = MOMENTS[stIdx], used = m.stk.map(s => [s[2], s[3]]).concat((stMine[m.id] || []).map(s => [s.x, s.y]));
  let best = SPOTS[0], bd = -1;
  SPOTS.forEach(p => { const d = Math.min(...used.map(u => Math.hypot(u[0] - p[0], u[1] - p[1])), 999); if (d > bd) { bd = d; best = p; } });
  return [best[0] + (Math.random() * 16 - 8), best[1] + (Math.random() * 16 - 8)];
}
// 기운 버튼: 탭 → 빈 자리에 찍힘 / 끌어서 사진 위에 놓기
const stBtns = document.getElementById("stBtns");
ST_BTNS.forEach(b => {
  const el = document.createElement("button"); el.type = "button"; el.className = "st-btn"; el.setAttribute("aria-label", b.label + " 보내기");
  el.style.cssText = `left:${b.cx - b.size / 2}px;top:${b.cy - b.size / 2}px;width:${b.size}px;height:${b.size}px`;
  const a = ST_ART[b.type]; el.innerHTML = `<img src="${a.src}" alt="" style="width:${a.w * b.k}px;height:${a.h * b.k}px">`;
  stBtns.appendChild(el);
  let start = null, ghost = null;
  const toStory = e => { const r = story.getBoundingClientRect(), k = r.width / 402; return [(e.clientX - r.left) / k, (e.clientY - r.top) / k]; };
  el.addEventListener("pointerdown", e => { e.preventDefault(); el.setPointerCapture(e.pointerId); start = toStory(e); });
  el.addEventListener("pointermove", e => {
    if (!start) return; const p = toStory(e);
    if (!ghost && Math.hypot(p[0] - start[0], p[1] - start[1]) > 8) { ghost = stickerEl(b.type, "", 0, 0, false, 0); ghost.classList.remove("stamp"); ghost.classList.add("ghost"); story.appendChild(ghost); }
    if (ghost) { ghost.style.left = p[0] + "px"; ghost.style.top = p[1] + "px"; }
  });
  const end = e => {
    if (!start) return; const p = toStory(e); start = null;
    if (ghost) {
      ghost.remove(); ghost = null;
      const x = p[0] - 20, y = p[1] - 125;   // 사진 안 좌표
      if (x > 0 && x < 362 && y > 0 && y < 424 && !story.classList.contains("typing")) addMine(b.type, Math.min(342, Math.max(20, x)), Math.min(404, Math.max(20, y)));
      return;
    }
    if (e.type === "pointerup" && !story.classList.contains("typing")) { const [x, y] = freeSpot(); addMine(b.type, x, y); }
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", () => { start = null; if (ghost) { ghost.remove(); ghost = null; } });
});
// 메시지: 칸을 누르면 입력 화면, 데모 문장이 자동으로 써짐 (직접 쳐도 됨)
function startTyping() {
  if (story.classList.contains("typing")) return;
  story.classList.add("typing"); stIn.value = "";
  const text = MOMENTS[stIdx].typed; let i = 0; clearInterval(stTypeT);
  stTypeT = setInterval(() => { if (i >= text.length) { clearInterval(stTypeT); return; } stIn.value = text.slice(0, ++i); }, 75);
  setTimeout(() => { try { stIn.focus({ preventScroll: true }); } catch (e) {} }, 50);
}
function stopTyping(instant) { clearInterval(stTypeT); story.classList.remove("typing"); stIn.value = ""; try { stIn.blur(); } catch (e) {} }
stIn.addEventListener("pointerdown", e => { e.preventDefault(); startTyping(); });
stIn.addEventListener("focus", startTyping);
stIn.addEventListener("input", () => clearInterval(stTypeT));
stIn.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("stSend").click(); });
document.getElementById("stSend").addEventListener("pointerdown", e => e.preventDefault());
document.getElementById("stSend").addEventListener("click", () => {
  if (!story.classList.contains("typing")) { startTyping(); return; }
  if (!stIn.value.trim()) return;
  stopTyping(); toast(`${MOMENTS[stIdx].name}님에게 메시지를 남겼어요`, 1600);
});
document.getElementById("stBack").addEventListener("click", () => { if (story.classList.contains("typing")) { stopTyping(); return; } if (!busy) pop(); });
stPhoto.addEventListener("click", () => { if (story.classList.contains("typing")) stopTyping(); });
// 옆으로 밀면 다음·이전 친구
(() => {
  let p0 = null;
  story.addEventListener("pointerdown", e => { if (e.target.closest(".st-btn, #stMsg, #stBack") || story.classList.contains("typing")) return; p0 = [e.clientX, e.clientY]; });
  story.addEventListener("pointerup", e => {
    if (!p0) return; const k = story.getBoundingClientRect().width / 402, dx = (e.clientX - p0[0]) / k, dy = (e.clientY - p0[1]) / k; p0 = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    const n = stIdx + (dx < 0 ? 1 : -1); if (n < 0 || n >= MOMENTS.length) return;
    stIdx = n; renderStory(dx < 0 ? 1 : -1);
  });
  story.addEventListener("pointercancel", () => { p0 = null; });
})();
addEventListener("message", e => {
  if (e.data === "chiring:home") closeFreq("home");
  if (e.data === "chiring:friends") closeFreq("friends");
});
function boot() {
  const h = location.hash.slice(1);
  if (h === "home" || h === "friends") {   // 다른 화면에서 돌아올 때는 오늘의 운세를 건너뜀
    fortuneSeen = true; start(false);
    if (h === "friends") setTab("friends", true);
  } else if (h === "keyring") {          // 공유용 링크: 주소 끝에 #keyring 을 붙이면 바로 키링 화면
    fortuneSeen = true; start(false);
    setTimeout(() => { busy = false; push("evening"); window.evStart(); }, 60);
  } else start(false);
}
if (document.readyState === "complete") boot(); else addEventListener("load", boot, { once: true });
