<style id="team-rub-fx">
/* 팀 프로토타입: 카드 문지르기 → 기운이 모이는 인터랙션 (시안 '나에게 기운 충전 완료!' 화면의 빛나는 카드 결)
   ① 손가락이 닿으면 카드가 살짝 눌리고(.982) 누른 쪽으로 기울어짐, 문지르는 방향으로 조금 끌려갔다 돌아옴(마찰)
   ② 손가락 자리에 빛이 맺힘, 빨리 문지를수록 밝아짐
   ③ 주변의 빛 알갱이가 카드로 빨려 들어옴 → 카드 바깥 빛(후광)이 문지른 만큼 커짐(시안처럼 두껍게)
   ④ 아래 빛도 문지른 만큼 차오름 ⑤ 다 모이면 카드가 환하게 터지며 사라지고 참이 나타남 */
.gifted{--rr:0;--heat:0}
.gifted__card{
  --tx:0;--ty:0;--dx:0px;--dy:0px;--press:0;--sx:50%;--sy:55%;
  filter:
    drop-shadow(0 0 calc(var(--rub,0) * 9px + var(--heat) * 6px) color-mix(in srgb, var(--wish,#91e2ff) 95%, transparent))
    drop-shadow(0 0 calc(var(--rub,0) * 38px + var(--heat) * 14px) color-mix(in srgb, var(--wish,#91e2ff) 70%, transparent))
    brightness(calc(1 + var(--heat) * .06 + var(--rub,0) * .04));
  transform: perspective(1100px) translate(var(--dx), var(--dy)) rotateX(calc(var(--ty) * 1deg)) rotateY(calc(var(--tx) * 1deg)) scale(calc(1 - var(--press) * .018));
  will-change: transform, filter;
}
.gifted__card .tr-fx{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
/* 손가락 자리의 빛 */
.gifted__card .tr-touch{mix-blend-mode:screen;opacity:calc(var(--press) * (.32 + var(--heat) * .55));
  background:radial-gradient(circle 120px at var(--sx) var(--sy), rgba(255,255,255,.62) 0%, color-mix(in srgb, var(--wish,#91e2ff) 45%, transparent) 38%, transparent 72%)}
/* 모인 기운: 카드 가운데부터 차오르는 빛 */
.gifted__card .tr-core{mix-blend-mode:soft-light;opacity:calc(var(--rub,0) * var(--rub,0) * .9 + var(--heat) * .15);
  background:radial-gradient(70% 55% at 50% 56%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 45%, transparent 75%)}
/* 기울기에 따라 표면을 훑는 빛 */
.gifted__card .tr-sheen{mix-blend-mode:overlay;opacity:calc(.12 + var(--press) * .28);
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.7) 50%, transparent 70%) no-repeat;background-size:260% 100%;
  background-position:calc(50% - var(--tx) * 9%) 0}
.gifted .tr-dust{position:absolute;left:0;top:0;width:402px;height:874px;pointer-events:none;z-index:2;mix-blend-mode:screen}
.gifted__glow{opacity:calc(.72 + var(--rr) * .28 + var(--heat) * .08);translate:0 calc((1 - var(--rr)) * 46px);transition:opacity .25s linear}
.gifted__wish-bar i{box-shadow:0 0 calc(8px + var(--heat) * 10px) var(--wish)}
/* 다 모이면: 환하게 부풀었다가 빛으로 흩어짐 (그 사이 참이 나타남) */
.gifted__card.is-out{animation:tr-card-out .75s cubic-bezier(.3,0,.2,1) both}
@keyframes tr-card-out{
  0%{opacity:1}
  28%{opacity:1;transform:perspective(1100px) scale(1.03);filter:brightness(1.22) drop-shadow(0 0 12px var(--wish,#91e2ff)) drop-shadow(0 0 46px var(--wish,#91e2ff))}
  100%{opacity:0;transform:perspective(1100px) scale(.93);filter:brightness(1.5) blur(3px) drop-shadow(0 0 30px var(--wish,#91e2ff))}
}
.gifted__card.is-out .tr-fx{opacity:0;transition:opacity .15s linear}
@media (prefers-reduced-motion: reduce){.gifted__card{transform:none}.gifted .tr-dust{display:none}}
</style>
<script id="team-rub-js">
/* 문지르기 인터랙션: 손가락 위치·속도를 읽어 카드에 CSS 변수로 넘기고(스프링으로 부드럽게), 빛 알갱이를 그림 */
(function () {
  var S = { on: false, x: 0, y: 0, lx: 0, ly: 0, lt: 0, speed: 0, vx: 0, vy: 0 };
  var V = { tx: 0, ty: 0, dx: 0, dy: 0, press: 0, heat: 0, rr: 0, sx: .5, sy: .55 };
  var root = null, card = null, cv = null, ctx = null, dust = [], burstDone = false, raf = 0, last = 0, acc = 0;
  var RES = 3;   // 캔버스 해상도 (영상·고해상도 화면에서도 선명하게)
  function rgb() {
    var c = getComputedStyle(root).getPropertyValue('--wish').trim() || '#91e2ff';
    var m = c.match(/^#([0-9a-f]{6})$/i); if (m) { var n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
    m = c.match(/(\d+)\D+(\d+)\D+(\d+)/); return m ? [+m[1], +m[2], +m[3]] : [145, 226, 255];
  }
  function attach() {
    var r = document.querySelector('.gifted'); if (r === root) return;
    root = r; card = null; dust = []; burstDone = false; V.rr = 0;
    if (!root) return;
    cv = document.createElement('canvas'); cv.className = 'tr-dust'; cv.width = 402 * RES; cv.height = 874 * RES; ctx = cv.getContext('2d');
    root.appendChild(cv);
  }
  function decorate() {
    var c = root && root.querySelector('.gifted__card'); if (!c || c === card) return; card = c;
    var img = c.querySelector('img'); if (!img) return;
    ['tr-core', 'tr-touch', 'tr-sheen'].forEach(function (k) {
      var e = document.createElement('i'); e.className = 'tr-fx ' + k;
      e.style.webkitMaskImage = e.style.maskImage = 'url("' + img.src + '")'; c.appendChild(e);
    });
  }
  function local(e) {   // 화면(402×874) 좌표
    var r = root.getBoundingClientRect(), k = root.offsetWidth / r.width || 1;
    return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k };
  }
  function rubbing() { return root && root.classList.contains('is-rub'); }
  document.addEventListener('pointerdown', function (e) {
    if (!root || !root.contains(e.target) || !rubbing()) return;
    var p = local(e); S.on = true; S.x = S.lx = p.x; S.y = S.ly = p.y; S.lt = performance.now(); kick();
  }, true);
  document.addEventListener('pointermove', function (e) {
    if (!S.on || !rubbing()) return;
    var p = local(e), t = performance.now(), dt = Math.max(8, t - S.lt);
    var vx = (p.x - S.lx) / dt, vy = (p.y - S.ly) / dt;   // px/ms
    S.vx = S.vx * .6 + vx * .4; S.vy = S.vy * .6 + vy * .4;
    S.speed = S.speed * .7 + Math.hypot(vx, vy) * .3;
    S.x = S.lx = p.x; S.y = S.ly = p.y; S.lt = t;
  }, true);
  function up() { S.on = false; }
  document.addEventListener('pointerup', up, true); document.addEventListener('pointercancel', up, true);

  function spawn(n, cx, cy, toward) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, d = toward ? 170 + Math.random() * 130 : 110 + Math.random() * 40;
      dust.push({
        x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d * 1.15, vx: toward ? 0 : Math.cos(a) * (60 + Math.random() * 150), vy: toward ? 0 : Math.sin(a) * (60 + Math.random() * 150),
        r: 1.1 + Math.random() * 1.7, age: 0, life: toward ? 1.1 + Math.random() * .7 : .7 + Math.random() * .6, toward: toward, tw: Math.random() * 6
      });
    }
  }
  function frame(t) {
    raf = 0; attach(); if (!root) return;
    decorate();
    var dt = last ? Math.min(.05, (t - last) / 1000) : 1 / 60; last = t;
    var rub = card ? parseFloat(card.style.getPropertyValue('--rub')) || 0 : 0;
    var done = root.classList.contains('is-done');
    // 목표값
    var on = S.on && rubbing();
    var cr = card && card.getBoundingClientRect(), rr = root.getBoundingClientRect(), k = root.offsetWidth / rr.width || 1;
    var cx = 200, cy = 455, cw = 288, ch = 364;
    if (cr && cr.width) { cw = card.offsetWidth; ch = card.offsetHeight; cx = card.offsetLeft + cw / 2; cy = card.offsetTop + ch / 2; }
    var px = Math.max(0, Math.min(1, (S.x - (cx - cw / 2)) / cw)), py = Math.max(0, Math.min(1, (S.y - (cy - ch / 2)) / ch));
    var heatT = on ? Math.min(1, S.speed / 1.4) : 0;
    S.speed *= Math.pow(.02, dt);   // 손이 멈추면 속도도 잦아듦
    var tgt = {
      press: on ? 1 : 0, heat: heatT,
      tx: on ? (px - .5) * 7 : 0, ty: on ? (.5 - py) * 6 : 0,     // 누른 쪽이 살짝 들어가게
      dx: on ? Math.max(-5, Math.min(5, S.vx * 3.2)) : 0, dy: on ? Math.max(-4, Math.min(4, S.vy * 2.4)) : 0,   // 마찰로 살짝 끌려감
      sx: on ? px : V.sx, sy: on ? py : V.sy, rr: done ? 1 : rub
    };
    function spring(key, f) { V[key] += (tgt[key] - V[key]) * (1 - Math.exp(-dt * f)); }
    spring('press', 16); spring('heat', tgt.heat > V.heat ? 10 : 3); spring('tx', 9); spring('ty', 9); spring('dx', 14); spring('dy', 14); spring('sx', 22); spring('sy', 22); spring('rr', 5);
    if (card) {
      var st = card.style;
      st.setProperty('--tx', V.tx.toFixed(3)); st.setProperty('--ty', V.ty.toFixed(3));
      st.setProperty('--dx', V.dx.toFixed(2) + 'px'); st.setProperty('--dy', V.dy.toFixed(2) + 'px');
      st.setProperty('--press', V.press.toFixed(3));
      st.setProperty('--sx', (V.sx * 100).toFixed(2) + '%'); st.setProperty('--sy', (V.sy * 100).toFixed(2) + '%');
    }
    root.style.setProperty('--heat', V.heat.toFixed(3)); root.style.setProperty('--rr', V.rr.toFixed(3));
    // 빛 알갱이: 문지르는 동안 주변에서 카드(손가락 쪽)로 모여듦
    if (rubbing()) { acc += dt * (V.press * (6 + V.heat * 46) + rub * 4); var n = Math.floor(acc); acc -= n; if (n) spawn(n, cx, cy, true); }
    if (done && !burstDone) { burstDone = true; spawn(46, cx, cy, false); }
    if (ctx) {
      var c = rgb(), tint = c.map(function (v) { return Math.round(v + (255 - v) * .6); });
      ctx.setTransform(RES, 0, 0, RES, 0, 0); ctx.clearRect(0, 0, 402, 874); ctx.globalCompositeOperation = 'lighter';
      var gx = cx + (V.sx - .5) * cw * .6, gy = cy + (V.sy - .5) * ch * .6, keep = [];
      for (var i = 0; i < dust.length; i++) {
        var d = dust[i]; d.age += dt; var u = d.age / d.life; if (u >= 1) continue;
        if (d.toward) {   // 끌려 들어감: 처음엔 느리다 점점 빨라짐, 살짝 휘며
          var ax = gx - d.x, ay = gy - d.y, dist = Math.hypot(ax, ay) || 1;
          if (dist < 18) continue;
          var pull = 260 + 900 * u * u;
          d.vx += (ax / dist * pull - ay / dist * 90) * dt; d.vy += (ay / dist * pull + ax / dist * 90) * dt;
          d.vx *= Math.pow(.15, dt); d.vy *= Math.pow(.15, dt);
        } else { d.vx *= Math.pow(.08, dt); d.vy *= Math.pow(.08, dt); d.vy -= 30 * dt; }
        var ox = d.x, oy = d.y; d.x += d.vx * dt; d.y += d.vy * dt;
        var a = (d.toward ? Math.sin(Math.PI * Math.min(1, u * 1.15)) : (1 - u) * (1 - u)) * (.55 + .45 * Math.sin(d.age * 9 + d.tw));
        if (d.toward) { ctx.strokeStyle = 'rgba(' + tint.join(',') + ',' + (a * .22).toFixed(3) + ')'; ctx.lineWidth = d.r * 1.6; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(ox - d.vx * dt * 1.4, oy - d.vy * dt * 1.4); ctx.lineTo(d.x, d.y); ctx.stroke(); }
        var R = d.r * 5, g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, R);
        g.addColorStop(0, 'rgba(255,255,255,' + a.toFixed(3) + ')'); g.addColorStop(.18, 'rgba(' + tint.join(',') + ',' + (a * .7).toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + c.join(',') + ',0)');
        ctx.fillStyle = g; ctx.fillRect(d.x - R, d.y - R, R * 2, R * 2);
        keep.push(d);
      }
      dust = keep;
    }
    if (root && (rubbing() || dust.length || Math.abs(V.press) > .002 || Math.abs(V.heat) > .002 || Math.abs(V.rr - tgt.rr) > .002 || Math.abs(V.dx) > .05)) kick();
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }
  new MutationObserver(function () { if (document.querySelector('.gifted') !== root || (root && root.classList.contains('is-rub'))) { last = 0; kick(); } })
    .observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
})();
</script>
